<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>编辑客户端</title>
	<link rel="stylesheet" th:href="@{/css/common.css}">
	<link rel="stylesheet" th:href="@{/css/pages/client-edit.css}">
</head>

<body>
	<div sec:authorize="hasAuthority('ROLE_ADMIN')">
		<div th:replace="~{fragments/nav :: admin-nav}"></div>
	</div>

	<div class="container">
		<a th:href="@{/admin/clients}" class="back-link">
			<svg viewBox="0 0 24 24">
				<path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
			</svg>
			返回客户端列表
		</a>

		<div class="form-card" th:if="${client}">
			<div class="form-header">
				<div class="form-icon">
					<svg viewBox="0 0 24 24">
						<path
							d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" />
					</svg>
				</div>
				<h1>编辑客户端：<span class="client-id" th:text="${client.clientId}"></span></h1>
			</div>

			<form th:action="@{/admin/clients/edit}" method="post">
				<input type="hidden" name="clientId" th:value="${client.clientId}">
				<div class="form-group">
					<label>Client ID</label>
					<input type="text" th:value="${client.clientId}" readonly>
					<p class="form-hint">Client ID 不可修改</p>
				</div>
				<div class="form-group">
					<label>Client Secret（新密钥）</label>
					<input type="password" name="clientSecret" placeholder="留空则不修改密钥">
					<p class="form-hint">仅当需要更换密钥时填写，留空则保持原密钥</p>
				</div>
				<div class="form-divider"></div>
				<div class="form-group">
					<label>客户端名称</label>
					<input type="text" name="clientName" th:value="${client.clientName}" required>
				</div>
				<div class="form-group">
					<label>Redirect URI（可多行，每行一个）</label>
					<textarea name="redirectUri" rows="6" placeholder="每行一个完整 URL，须与外部系统发起授权时带的 redirect_uri 完全一致（含查询参数）"
						th:text="${client.redirectUri}" required></textarea>
					<p class="form-hint">须与第三方发起登录时的 redirect_uri 完全一致，例如：<code>https://re.civer.cn/api/auth/sso_callback?method=get_sso_id</code> 与 <code>...?method=sso_get_token</code> 是不同 URI，可同时填写多行。</p>
				</div>
				<div class="form-group">
					<label>Post Logout Redirect URI</label>
					<input type="text" name="postLogoutRedirectUri" th:value="${client.postLogoutRedirectUri}"
						placeholder="http://localhost:8080/" required>
				</div>
				<div class="form-group">
					<label style="display:flex;align-items:center;gap:10px;cursor:pointer;">
						<input type="checkbox" name="requirePkce" value="true" th:checked="${client.requirePkce}"
							style="width:18px;height:18px;accent-color:#f093fb;cursor:pointer;" />
						要求 PKCE (Proof Key for Code Exchange)
					</label>
					<p class="form-hint">建议开启。对接不支持 PKCE 的外部系统时（如 Gitea、Redmine 等），取消勾选。</p>
				</div>
				<div class="form-divider"></div>
				<button type="submit" class="btn-save">
					<svg viewBox="0 0 24 24">
						<path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" />
					</svg>
					保存修改
				</button>
			</form>
		</div>
	</div>
</body>

</html>
