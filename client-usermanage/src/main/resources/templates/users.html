<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>
	<link rel="stylesheet" th:href="@{/css/common.css}">
	<link rel="stylesheet" th:href="@{/css/pages/users.css}">
</head>

<body>

    <div th:replace="~{fragments/nav :: admin-nav}"></div>

    <div class="container">
        <div class="page-header">
            <h1>User Management</h1>
        </div>

        <div class="form-card">
            <h3>
                <svg viewBox="0 0 24 24">
                    <path
                        d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
                </svg>
                Add New User
            </h3>
            <form th:action="@{/admin/users}" th:object="${newUser}" method="post">
                <div class="form-row">
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" th:field="*{username}" placeholder="Enter username" required />
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" th:field="*{password}" placeholder="Enter password" required />
                    </div>
                    <div class="form-group">
                        <label>Role</label>
                        <select th:field="*{role}">
                            <option value="ROLE_USER">User</option>
                            <option value="ROLE_ADMIN">Admin</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-create">
                        <svg viewBox="0 0 24 24">
                            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
                        </svg>
                        Create
                    </button>
                </div>
            </form>
        </div>

        <div class="table-card">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Username</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${users}">
                            <td class="user-id" th:text="${user.id}">1</td>
                            <td th:text="${user.username}">admin</td>
                            <td>
                                <span class="role-badge"
                                    th:classappend="${user.role == 'ROLE_ADMIN'} ? 'role-admin' : 'role-user'"
                                    th:text="${user.role == 'ROLE_ADMIN'} ? 'Admin' : 'User'">Admin</span>
                            </td>
                            <td>
                                <span th:if="${user.enabled}" class="status-active">Active</span>
                                <span th:unless="${user.enabled}" class="status-disabled">Disabled</span>
                            </td>
                            <td>
                                <div class="actions">
                                    <a th:href="@{/admin/users/{id}/edit(id=${user.id})}" class="btn-action btn-edit">
                                        <svg viewBox="0 0 24 24">
                                            <path
                                                d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" />
                                        </svg>
                                        Edit
                                    </a>
                                    <form th:action="@{/admin/users/{id}/status(id=${user.id})}" method="post"
                                        style="display:inline;">
                                        <button type="submit" class="btn-action"
                                            th:class="${user.enabled} ? 'btn-action btn-disable' : 'btn-action btn-enable'">
                                            <svg th:if="${user.enabled}" viewBox="0 0 24 24">
                                                <path
                                                    d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11H7v-2h10v2z" />
                                            </svg>
                                            <svg th:unless="${user.enabled}" viewBox="0 0 24 24">
                                                <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" />
                                            </svg>
                                            <span th:text="${user.enabled} ? 'Disable' : 'Enable'"></span>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</body>

</html>
