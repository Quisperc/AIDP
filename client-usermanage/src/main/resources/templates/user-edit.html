<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Edit User</title>
	<link rel="stylesheet" th:href="@{/css/common.css}">
	<link rel="stylesheet" th:href="@{/css/pages/user-edit.css}">
</head>

<body>
	<div class="container">
		<a href="/admin/users" class="back-link">
			<svg viewBox="0 0 24 24">
				<path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
			</svg>
			Back to User List
		</a>

		<div class="form-card">
			<div class="form-header">
				<div class="form-icon">
					<svg viewBox="0 0 24 24">
						<path
							d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" />
					</svg>
				</div>
				<h1>Edit User: <span class="username" th:text="${user.username}"></span></h1>
			</div>

			<form th:action="@{/users/{id}/update(id=${user.id})}" th:object="${user}" method="post">
				<div class="form-group">
					<label>Username</label>
					<input type="text" th:field="*{username}" readonly>
					<p class="form-hint">Username cannot be changed</p>
				</div>

				<div class="form-group">
					<label>Role</label>
					<select th:field="*{role}">
						<option value="ROLE_USER">User</option>
						<option value="ROLE_ADMIN">Admin</option>
					</select>
				</div>

				<div class="form-group">
					<label>Status</label>
					<select th:field="*{enabled}">
						<option th:value="true">Active</option>
						<option th:value="false">Disabled</option>
					</select>
				</div>

				<div class="form-divider"></div>

				<div class="form-group">
					<label>New Password</label>
					<input type="password" th:field="*{password}" placeholder="Enter new password to change">
					<p class="form-hint">Leave blank to keep current password</p>
				</div>

				<button type="submit" class="btn-save">
					<svg viewBox="0 0 24 24">
						<path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" />
					</svg>
					Save Changes
				</button>
			</form>
		</div>
	</div>
</body>

</html>
