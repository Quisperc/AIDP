services:
  postgres:
    image: postgres:18
    container_name: auth_db
    restart: unless-stopped
    ports:
      # 只监听本机：默认 0.0.0.0 会把开发库直接暴露到局域网
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-authdb}
      POSTGRES_USER: ${DB_USER:-admin}
      # 不留弱默认口令：未设置时 compose 直接报错
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      # 增加 -d 参数，显式指定连接 authdb 数据库
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-authdb}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - postgres-network
    # 可选：如果需要外部访问指定IP
    # network_mode: "host"  # 使用主机网络模式，注意这会暴露所有端口

volumes:
  postgres_data:
    name: postgres-18-authdb

networks:
  postgres-network:
    driver: bridge