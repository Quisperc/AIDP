server:
  port: 8080
  # 让 Spring 识别代理（Nginx / 1Panel 反代）传来的 X-Forwarded-*，否则 issuer 与跳转地址会带内网地址
  forward-headers-strategy: native
  servlet:
    # 响应头显式带 charset=UTF-8：页面虽有 <meta charset>，但缺 header 时
    # 代理/浏览器仍可能按 ISO-8859-1 猜，中文会变乱码；也避免日志里抓到的
    # 响应体出现同样问题。force=true 让编码过滤器同时作用于请求与响应。
    encoding:
      charset: UTF-8
      force: true
    session:
      cookie:
        # 自定义名称，避免与子系统的会话 cookie 撞名
        name: AUTH_SESSIONID
        # 刻意不设 domain：OIDC 下各客户端各自维护自己的会话，
        # 认证中心不需要把 cookie 发到所有子域。设成 .civer.cn 等于让
        # idp 的会话 cookie 出现在每个子系统的请求里，扩大泄露面，
        # 也会让本地用 127.0.0.1 调试时会话存不下来（域名不匹配被丢弃）。
        # 确实需要跨子域共享时，再显式配置 domain。
        http-only: true
        same-site: lax

spring:
  config:
    # 敏感配置（数据库口令等）放在同目录的 application-secret.yml，已 gitignore
    import: optional:file:./application-secret.yml
  application:
    name: auth-server
  datasource:
    url: jdbc:postgresql://localhost:5432/authdb # 数据库连接地址
    username: username # 数据库用户名
    password: password # 数据库密码
    driver-class-name: org.postgresql.Driver
  sql:
    # schema 已由 Flyway 统一管理，不再走 schema.sql（原文件已删除）
    init:
      mode: never
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    # 对已有库自动打基线并跳过早期迁移，避免与历史表结构冲突。
    # 这几项由 FlywayConfig 读取后显式传给 Flyway —— Spring Boot 4 不再提供
    # FlywayAutoConfiguration，写在 yml 里不会被自动应用，必须由代码读走。
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    # 迁移失败应中止启动，而不是带着半截 schema 继续跑
    fail-on-missing-locations: true
  jpa:
    hibernate:
      # 结构由 Flyway 负责，Hibernate 不再自动改表。
      # 排查期可临时设 DDL_AUTO=update 比对差异，但不要长期开着。
      ddl-auto: ${DDL_AUTO:none}
    # 生产必须为 false：打印 SQL 会把参数值一并写进日志。调试时用 SHOW_SQL=true 临时开启。
    show-sql: ${SHOW_SQL:false}
    open-in-view: false # 显式关闭 Open Session in View，避免视图层访问数据库
  # ---- 多实例开关 ----
  # 默认单机：session 走本地 Servlet 容器，cache 用 ConcurrentMap。
  # 部署多个实例时统一设置 SESSION_STORE=redis、CACHE_TYPE=redis 和 REDIS_*，
  # 即可让登录会话与 host 白名单缓存跨实例共享。
  session:
    store-type: ${SESSION_STORE:none}
    redis:
      namespace: aidp:auth
  cache:
    type: ${CACHE_TYPE:simple}
    cache-names: ssoAllowedHosts
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s
      connect-timeout: 3s
  security:
    oauth2:
      authorizationserver:
        issuer: ${app.base-url}



management:
  endpoints:
    web:
      exposure:
        # 只暴露探活与健康，info/env/beans 等一律不放开：
        # env 会泄露配置中的敏感值，beans 会暴露内部结构
        include: health,info
  endpoint:
    health:
      # 仅对管理员展示细节；匿名访问只返回 UP/DOWN
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

app:
  # 认证中心对外 issuer（生产须为 https://idp.civer.cn），必须与各子系统 issuer-uri 一致，
  # 否则 Back-Channel Logout 的 logout_token 验签失败（现象：全局登出时别的系统不退）
  base-url: ${APP_BASE_URL:http://127.0.0.1:8080}
  # 底部备案信息（留空则不显示）。字段定义见 config/FooterProperties
  footer:
    icp: "渝ICP备2026020534号" # 例如：京ICP备xxxxxxxx号
    icp-url: "https://beian.miit.gov.cn/"
    icp-icon: "/images/icp.png" # ICP 备案图标。静态文件放 static 目录下，URL 用 /images/xxx.png（不要写 /static）
    police: "渝公网安备50019002505695号" # 例如：京公网安备xxxxxxxxxxxx号
    police-url: "https://www.beian.gov.cn/portal/registerSystemInfo?recordcode=50019002505695" # recordcode 必须与备案号中的数字一致
    police-icon: "/images/beian.png" # 公安备案图标，同上，路径为 /images/xxx.png

  auth:
    # 新建客户端的访问令牌有效期（管理台注册客户端时统一采用）
    access-token-time-to-live: ${ACCESS_TOKEN_TTL:30m}

  signing-key:
    # 签名密钥在 oauth2_signing_key 表中的主键。同一套库要跑两套互不干扰的环境时，
    # 才需要换 record-id；正常情况下保持 primary，改它等于换密钥（已签发令牌全部失效）
    record-id: ${SIGNING_KEY_RECORD_ID:primary}

  sso:
    # 各子系统接收 logout_token 的固定路径。改这里必须同步改所有子系统，
    # 且该端点需与注册的回调同域同端口（推送地址取 redirect_uri 的 origin）
    client-logout-path: ${SSO_CLIENT_LOGOUT_PATH:/api/sso-logout}

  bootstrap:
    # 空库时是否写入演示账号 admin / user。
    # 默认关闭：漏配环境变量的代价是「没人能登录」（立刻发现），
    # 而默认开启的代价是「带着 admin/password 上线」（没人会发现）。
    # 本地开发在 application-secret.yml 里设成 true 即可。
    seed-demo-users: ${APP_BOOTSTRAP_SEED_DEMO_USERS:false}
    demo-user-password: ${APP_BOOTSTRAP_DEMO_USER_PASSWORD:password}