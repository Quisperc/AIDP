<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="color-scheme" content="light dark">
	<title>AIDP 统一身份认证</title>
	<link rel="stylesheet" th:href="@{/css/hig.css}">
</head>

<body>
	<main class="page-main">
		<div class="welcome-container auth-card">
			<div class="auth-brand">
				<span class="brand-mark" aria-hidden="true">A</span>
				<span class="brand-name">AIDP</span>
				<span class="brand-divider" aria-hidden="true"></span>
				<span>统一身份认证</span>
			</div>

			<h1 class="auth-title">一次登录，访问所有内部系统</h1>
			<p class="auth-sub">
				这里是 AIDP 的认证中心。登录后，你不再需要为每个子系统单独输入密码。
			</p>

			<a href="/login" class="btn-primary btn-login btn-block">前往登录</a>

			<ul class="features">
				<li class="feature">
					<span class="feature-icon" aria-hidden="true">
						<svg viewBox="0 0 24 24">
							<path d="M18 8h-1V6a5 5 0 0 0-10 0v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zm-6 9a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm3-9H9V6a3 3 0 0 1 6 0v2z" />
						</svg>
					</span>
					<span class="feature-text">
						<span class="feature-title">单点登录</span>
						<span>登录一次，所有已接入的子系统共享同一会话。</span>
					</span>
				</li>
				<li class="feature">
					<span class="feature-icon" aria-hidden="true">
						<svg viewBox="0 0 24 24">
							<path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-1 15-4-4 1.4-1.4L11 14.2l6.6-6.6L19 9l-8 8z" />
						</svg>
					</span>
					<span class="feature-text">
						<span class="feature-title">标准协议</span>
						<span>基于 OIDC / OAuth2，现成 SDK 可直接对接。</span>
					</span>
				</li>
				<li class="feature">
					<span class="feature-icon" aria-hidden="true">
						<svg viewBox="0 0 24 24">
							<path d="M12 1 3 5v6c0 5.6 3.8 10.7 9 12 5.2-1.3 9-6.4 9-12V5l-9-4z" />
						</svg>
					</span>
					<span class="feature-text">
						<span class="feature-title">统一退出</span>
						<span>注销一次，全部子系统同时下线，凭据不会残留。</span>
					</span>
				</li>
			</ul>
		</div>
	</main>
	<div th:replace="~{fragments/footer :: footer}"></div>
</body>

</html>
