<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="color-scheme" content="light dark">
	<title>登录 · AIDP 统一身份认证</title>
	<link rel="stylesheet" th:href="@{/css/hig.css}">
</head>

<body>
	<main class="page-main">
		<div class="auth-card">
			<!-- 认证页第一件事是让用户确认「这是哪个系统」，这是防钓鱼的视觉锚点 -->
			<div class="auth-brand">
				<span class="brand-mark" aria-hidden="true">A</span>
				<span class="brand-name">AIDP</span>
				<span class="brand-divider" aria-hidden="true"></span>
				<span>统一身份认证</span>
			</div>

			<h1 class="auth-title">登录</h1>
			<p class="auth-sub">使用你的 AIDP 账号继续访问已接入的业务系统</p>

			<div th:if="${param.error}" class="alert alert-error" role="alert">
				<svg viewBox="0 0 24 24" aria-hidden="true">
					<path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z" />
				</svg>
				<span>用户名或密码不正确，请重新输入。</span>
			</div>

			<!-- 连续失败达到阈值：服务端在认证前就拦下，这里只负责说明原因 -->
			<div th:if="${param.blocked}" class="alert alert-error" role="alert">
				<svg viewBox="0 0 24 24" aria-hidden="true">
					<path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z" />
				</svg>
				<span>尝试次数过多，该账号已被临时锁定。请稍后重试，或联系管理员。</span>
			</div>

			<div th:if="${param.logout}" class="alert alert-success" role="status">
				<svg viewBox="0 0 24 24" aria-hidden="true">
					<path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z" />
				</svg>
				<span>已安全退出。如需继续使用，请重新登录。</span>
			</div>

			<form th:action="@{/login}" method="post">
				<div class="form-group">
					<label for="username">用户名</label>
					<input type="text" id="username" name="username" placeholder="请输入用户名" required
						autofocus autocomplete="username" />
				</div>
				<div class="form-group">
					<label for="password">密码</label>
					<input type="password" id="password" name="password" placeholder="请输入密码" required
						autocomplete="current-password" />
				</div>
				<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
				<button type="submit" class="btn-primary">登录</button>
			</form>

			<p class="auth-foot">忘记密码请联系系统管理员重置；账号由组织统一分配，请勿共享。</p>
		</div>
	</main>
	<div th:replace="~{fragments/footer :: footer}"></div>
</body>

</html>
