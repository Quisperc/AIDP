<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
	<!-- 页脚：字段来自 FooterView（FooterModelAdvice 提供），模板统一用 footer.xxx 取值 -->
	<footer class="site-footer" th:fragment="footer">
		<div class="footer-inner" th:if="${!#strings.isEmpty(footer.icp) or !#strings.isEmpty(footer.police)}">
			<a th:if="${!#strings.isEmpty(footer.icp)}" th:attr="href=${footer.icpUrl}"
				target="_blank" rel="noopener noreferrer" class="footer-link footer-item">
				<img th:if="${!#strings.isEmpty(footer.icpIconSrc)}" th:src="${footer.icpIconSrc}"
					class="footer-icon" alt="ICP" />
				<span th:text="${footer.icp}">ICP备案号</span>
			</a>
			<span th:if="${!#strings.isEmpty(footer.icp) and !#strings.isEmpty(footer.police)}"
				class="footer-sep">|</span>
			<a th:if="${!#strings.isEmpty(footer.police) and !#strings.isEmpty(footer.policeUrl)}"
				th:attr="href=${footer.policeUrl}" target="_blank" rel="noopener noreferrer"
				class="footer-link footer-item">
				<img th:if="${!#strings.isEmpty(footer.policeIconSrc)}" th:src="${footer.policeIconSrc}"
					class="footer-icon" alt="公安备案" />
				<span th:text="${footer.police}">公安备案号</span>
			</a>
			<span th:if="${!#strings.isEmpty(footer.police) and #strings.isEmpty(footer.policeUrl)}"
				class="footer-link footer-item">
				<img th:if="${!#strings.isEmpty(footer.policeIconSrc)}" th:src="${footer.policeIconSrc}"
					class="footer-icon" alt="公安备案" />
				<span th:text="${footer.police}">公安备案号</span>
			</span>
		</div>
	</footer>
</body>
</html>
