<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- 管理台公共片段：<head> 与顶栏。管理台各页与账号页共用，改导航只改这里。 -->
<head th:fragment="head(title)">
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="color-scheme" content="light dark" />
	<title th:text="${title} + ' · AIDP 管理台'">AIDP 管理台</title>
	<link rel="stylesheet" th:href="@{/css/admin.css}" />
</head>

<body>

	<header th:fragment="topbar(active)" class="topbar">
		<a class="brand" th:href="@{/account}">
			<span class="brand-mark" aria-hidden="true">A</span>
			<span>AIDP</span>
			<span class="brand-sub">统一身份认证</span>
		</a>

		<nav class="nav" aria-label="主导航">
			<a class="nav-link" sec:authorize="hasAuthority('ROLE_ADMIN')" th:href="@{/admin/users}"
				th:classappend="${active == 'users'} ? 'is-active'">用户</a>
			<a class="nav-link" sec:authorize="hasAuthority('ROLE_ADMIN')" th:href="@{/admin/clients}"
				th:classappend="${active == 'clients'} ? 'is-active'">客户端</a>
			<a class="nav-link" sec:authorize="hasAuthority('ROLE_ADMIN')" th:href="@{/admin/audit}"
				th:classappend="${active == 'audit'} ? 'is-active'">审计</a>
			<a class="nav-link" th:href="@{/account}"
				th:classappend="${active == 'profile'} ? 'is-active'">账号</a>
		</nav>

		<div class="topbar-user">
			<span class="user-name" th:text="${displayName}">admin</span>
			<form th:action="@{/logout}" method="post">
				<button type="submit" class="btn btn-link">退出</button>
			</form>
		</div>
	</header>

	<!-- 操作结果提示。业务失败不打断整页，闪存消息回到原页面显示 -->
	<div th:fragment="alerts">
		<div th:if="${ok}" class="alert alert-ok" role="status" th:text="${ok}">已保存</div>
		<div th:if="${error}" class="alert alert-error" role="alert" th:text="${error}">出错了</div>
	</div>

	<!-- 分页条。basePath 由页面给出（/admin/users 等），页码统一走 ?page=N（0 基） -->
	<nav class="pager" th:fragment="pager(pager, basePath)" th:if="${pager.totalPages > 1}">
		<a class="btn" th:if="${pager.hasPrevious}"
			th:href="@{${basePath}(page=${pager.page - 1})}">上一页</a>
		<span class="pager-info">
			第 <span th:text="${pager.page + 1}">1</span> / <span th:text="${pager.totalPages}">1</span> 页
			· 共 <span th:text="${pager.totalElements}">0</span> 条
		</span>
		<a class="btn" th:if="${pager.hasNext}"
			th:href="@{${basePath}(page=${pager.page + 1})}">下一页</a>
	</nav>

</body>

</html>
