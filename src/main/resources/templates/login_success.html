<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="color-scheme" content="light dark">
	<title>已登录 · AIDP 统一身份认证</title>
	<link rel="stylesheet" th:href="@{/css/hig.css}">
</head>

<body>
	<main class="page-main">
		<div class="success-container auth-card">
			<div class="auth-brand">
				<span class="brand-mark" aria-hidden="true">A</span>
				<span class="brand-name">AIDP</span>
				<span class="brand-divider" aria-hidden="true"></span>
				<span>统一身份认证</span>
			</div>

			<div class="success-icon" aria-hidden="true">
				<svg viewBox="0 0 24 24">
					<path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z" />
				</svg>
			</div>

			<h1 class="auth-title">已登录</h1>
			<p class="auth-sub">身份校验通过。你可以关闭此页面，或返回业务系统继续操作。</p>

			<div class="info-list">
				<div class="info-item">
					<span class="info-label">账号</span>
					<span class="info-value" th:text="${displayName}">username</span>
				</div>
				<div class="info-item">
					<span class="info-label">角色</span>
					<span class="info-value" th:text="${roles}">roles</span>
				</div>
			</div>

			<div class="server-badge">
				<svg viewBox="0 0 24 24" aria-hidden="true">
					<path d="M12 1 3 5v6c0 5.6 3.8 10.7 9 12 5.2-1.3 9-6.4 9-12V5l-9-4z" />
				</svg>
				idp.civer.cn
			</div>

			<a class="btn-primary" th:href="@{/account}"
				style="display:block;text-align:center;text-decoration:none;line-height:44px">
				账号设置
			</a>

			<a sec:authorize="hasAuthority('ROLE_ADMIN')" class="btn-primary"
				th:href="@{/admin/users}"
				style="display:block;text-align:center;text-decoration:none;line-height:44px;margin-top:12px">
				进入管理台
			</a>

			<form th:action="@{/logout}" method="post" style="margin-top: var(--sp-6)">
				<button type="submit" class="btn-logout btn-block">退出登录</button>
			</form>
		</div>
	</main>
	<div th:replace="~{fragments/footer :: footer}"></div>
</body>

</html>
