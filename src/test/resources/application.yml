# 集成测试专用配置：使用 H2 内存库，不依赖外部 PostgreSQL。
# 注意 MODE=PostgreSQL —— 主库的 schema.sql 是 PostgreSQL 语法。
spring:
  datasource:
    url: jdbc:h2:mem:aidp-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  # 测试也走 Flyway：迁移脚本同时兼容 PostgreSQL 与 H2（MODE=PostgreSQL），
  # 这样每个集成测试都会真实验证一遍 V1 脚本，而不是只在生产库上第一次运行才发现问题。
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      # 表结构已由 Flyway 建立，Hibernate 不再介入
      ddl-auto: none
    show-sql: false
    open-in-view: false
  security:
    oauth2:
      authorizationserver:
        issuer: ${app.base-url}

server:
  port: 0

app:
  base-url: http://localhost:8080
  auth:
    initial-client:
      client-id: test-client
      client-secret: test-secret
      redirect-uris: http://localhost:8081/login/oauth2/code/oidc-client
      post-logout-redirect-uri: http://localhost:8080/login

logging:
  level:
    org.springframework.security: INFO
